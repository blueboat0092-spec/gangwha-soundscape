<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강화도 사운드스케이프 | Cartography of Memories</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; background: #e0acac; }
        #container { display: flex; height: 100vh; position: relative; }
        
        /* 왼쪽 사이드 텍스트 로고 스타일 */
        #vertical-logo {
            position: absolute; left: 0; bottom: 0; width: 50px; height: 100%;
            background: #fff; display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 30px; z-index: 2000; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }
        #vertical-logo h1 {
            writing-mode: vertical-rl; transform: rotate(180deg);
            font-size: 24px; color: #8e1d32; margin: 0; font-weight: 700;
        }

        /* 메인 지도 화면 */
        #map { flex: 1; margin-left: 50px; background: #e0acac; }

        /* 팝업 창 디자인 커스텀 */
        .leaflet-popup-content-wrapper {
            background: #8e1d32 !important; color: #fff !important;
            border-radius: 0px !important; padding: 15px; width: 280px;
        }
        .leaflet-popup-content { margin: 10px !important; line-height: 1.5; }
        .leaflet-popup-content b { font-size: 16px; letter-spacing: 1px; display: block; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }
        .leaflet-popup-content p { font-size: 13px; font-weight: 300; opacity: 0.9; }
        .leaflet-popup-tip { background: #8e1d32 !important; }
        .leaflet-popup-close-button { color: #fff !important; font-size: 20px !important; padding: 10px !important; }

        /* 반드캠프 플레이어 스타일 */
        iframe { border-radius: 0px; filter: invert(1) hue-rotate(180deg) brightness(1.5); margin-top: 10px; }

        /* 커스텀 마커(귀 모양) 애니메이션 */
        .ear-icon {
            background: #8e1d32; border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="container">
    <div id="vertical-logo">
        <h1>Gangwha Soundscape Archive</h1>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 이미지와 유사한 톤다운된 지도를 위해 디자인된 타일 사용
    const map = L.map('map', { zoomControl: false }).setView([37.68, 126.43], 11);
    
    // 부드러운 핑크/브라운 톤의 지도 스타일 (CartoDB Positron 기반 색상 반전 처리와 유사)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
        opacity: 0.8
    }).addTo(map);

    // 귀 모양 아이콘 생성 (이미지의 느낌을 살려 원형 안의 귀 기호 형상화)
    const earIcon = L.divIcon({
        className: 'ear-icon',
        html: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M12 2C8.69 2 6 4.69 6 8v3.29c-1.13.43-2 1.54-2 2.86 0 1.66 1.34 3 3 3h.5c.83 0 1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5H7c0-2.76 2.24-5 5-5s5 2.24 5 5h-.5c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5h.5c1.66 0 3-1.34 3-3 0-1.32-.87-2.43-2-2.86V8c0-3.31-2.69-6-6-6z"/></svg>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
    });

    const soundData = [
        { title: "01. 국자와주걱 책방 앞", lat: 37.652175, lng: 126.440529, desc: "책방 앞 풍경 소리와 고양이의 인사", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=2989378636/transparent=true/" },
        { title: "02. 석모도 민머루해변", lat: 37.6512988, lng: 126.3331996, desc: "모래사장 위를 걷는 발자국 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=753759855/transparent=true/" },
        { title: "03. 정족산 14처길", lat: 37.6365248, lng: 126.4875273, desc: "생명력 넘치는 여름 매미 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=1719650266/transparent=true/" },
        { title: "04. 정족산 입구 밤", lat: 37.631870, lng: 126.477204, desc: "고요한 산속의 밤", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=843445286/transparent=true/" },
        { title: "05. 전등사 대고", lat: 37.631830, lng: 126.484682, desc: "저녁 예불의 웅장한 북소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=372803100/transparent=true/" },
        { title: "06. 전등사 범종", lat: 37.631493, lng: 126.483674, desc: "마음을 울리는 종소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=1394143868/transparent=true/" },
        { title: "07. 동검도 동그랑섬", lat: 37.589020, lng: 126.525597, desc: "갯벌 위 섬의 바람", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=925560464/transparent=true/" },
        { title: "08. 강화 대산저수지", lat: 37.785945, lng: 126.479647, desc: "잔잔한 저수지의 아침", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=1588339098/transparent=true/" },
        { title: "09. 광성보 우수관 빗방울", lat: 37.665276, lng: 126.530615, desc: "공간의 울림이 담긴 물소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=224371653/transparent=true/" },
        { title: "10. 교동도 남산포구 밀물", lat: 37.763106, lng: 126.290747, desc: "차오르는 바다의 자장가", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=4164866312/transparent=true/" },
        { title: "11. 북일곶돈대 해안가", lat: 37.611408, lng: 126.375040, desc: "거친 바위 해안의 파도", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=519450696/transparent=true/" },
        { title: "12. 교동도 월선포구 썰물", lat: 37.774263, lng: 126.316992, desc: "갯벌이 숨 쉬는 시간", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=64694152/transparent=true/" },
        { title: "13. 강화도 첫눈", lat: 37.638092, lng: 126.490264, desc: "첫눈이 내리는 고요함", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=2110564066/transparent=true/" },
        { title: "14. 온수리 성당 삼종소리", lat: 37.640278, lng: 126.489879, desc: "기도를 알리는 낮의 종소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=2505151801/transparent=true/" },
        { title: "15. 평화전망대 북쪽 소리", lat: 37.820137, lng: 126.444672, desc: "바람을 타고 온 북녘의 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=3520696282/transparent=true/" },
        { title: "16. 교동도 새벽의 바람", lat: 37.768691, lng: 126.290418, desc: "수탁의 울음과 섬의 아침", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=ffffff/linkcol=0687f5/track=3411754260/transparent=true/" }
    ];

    soundData.forEach(data => {
        const marker = L.marker([data.lat, data.lng], { icon: earIcon }).addTo(map);
        const popupContent = `
            <div style="width:250px">
                <b>${data.title}</b>
                <p>${data.desc}</p>
                <iframe style="border: 0; width: 100%; height: 42px;" src="${data.audio}" seamless></iframe>
            </div>
        `;
        marker.bindPopup(popupContent);
    });
</script>

</body>
</html>
