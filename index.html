<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강화도 사운드스케이프 | Yi Cheolmin</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --primary-color: #8e1d32; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #app { display: flex; width: 100vw; height: 100vh; }

        /* 왼쪽 정보 패널 */
        #left-panel { width: 400px; background: #fff; padding: 40px 30px; display: flex; flex-direction: column; z-index: 2000; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .tab-menu { display: flex; gap: 15px; border-bottom: 1px solid #eee; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 700; color: #bbb; padding-bottom: 10px; }
        .tab-btn.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }
        #tab-content { flex: 1; overflow-y: auto; font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: #444; }

        /* 중앙 지도 */
        #map { flex: 1; z-index: 1; }
        .leaflet-popup-content-wrapper { width: 380px; border-radius: 12px; padding: 10px; }
        .track-info-popup { font-size: 13px; line-height: 1.6; }
        .track-info-popup b { font-size: 15px; color: var(--primary-color); display: block; margin-bottom: 8px; }
        .track-desc { color: #555; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 12px; white-space: pre-wrap; }
        .track-meta { font-size: 11px; color: #888; margin-top: 5px; font-family: monospace; }

        /* 오른쪽 재생목록 */
        #right-sidebar { width: 300px; background: #fafafa; border-left: 1px solid #eee; display: flex; flex-direction: column; z-index: 2000; }
        #track-list { flex: 1; overflow-y: auto; }
        .track-item { padding: 15px 20px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 13px; transition: 0.2s; color: #666; }
        .track-item:hover { background: #fff; }
        .track-item.active { background: #fff; border-left: 4px solid var(--primary-color); color: var(--primary-color); font-weight: 700; }
    </style>
</head>
<body>

<div id="app">
    <div id="left-panel">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="showTab('about', this)">ABOUT</button>
            <button class="tab-btn" onclick="showTab('credits', this)">CREDITS</button>
            <button class="tab-btn" onclick="showTab('equipment', this)">EQUIPMENT</button>
        </div>
        <div id="tab-content"></div>
    </div>
    <div id="map"></div>
    <div id="right-sidebar"><div id="track-list"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const infoData = {
        about: `강화도와 그 주변 섬들을 유영하며 기록한 사계절의 사운드스케이프 앨범입니다. (중략 - 이전 전문 보존)`,
        credits: `released April 2026\n\nCREDIT\nProduced by 이철민\nRecorded, edited and mastered by 이철민\nDesigned by 이재수\nCollaborators: yi, binna\n\n℗© 2026 Yi Cheolmin`,
        equipment: `EQUIPMENT\nZoom F8n, Zoom F3, Rode NT-SF1(Ambisonics),\nAudio-Technica AT8022, Clippy EM272, DIY Hydrophones`
    };

    const soundData = [
        { 
            id: "2989378636", title: "01. 강화도 국자와주걱 책방 앞", lat: 37.652175, lng: 126.440529, 
            desc: "강화도 도장리 마을의 오후 소리풍경\n책방 앞에 걸린 풍경이 바람에 울리고, 목수는 집을 고친다.\n녹음기에 호기심을 보이는 고양이가 말을 걸고\n멀리서 들려오는 개 짖는 소리와 새들의 지저귐,\n각자의 리듬이 자연스럽게 어우러지며 섬의 평화로운 오후가 그려진다.",
            meta: "Date: 2025-11-20 ☁️\nRecording: Zoom F3 / Clippy EM272 pair / AB Stereo"
        },
        { 
            id: "753759855", title: "02. 사운드워킹-석모도 민머루해변", lat: 37.651298, lng: 126.333199, 
            desc: "모래사장 위를 걸으면 기분 좋은 소리를 듣다\n세삼스럽게 내 속도를 느낄때,\n어느새 바다에 가까워진 태양 위로 떠나가는 비행기",
            meta: "Date: 2026-02-04 17:10 🌤️\nRecording: Zoom F3 / Clippy EM272 pair / AB Stereo"
        },
        { 
            id: "1719650266", title: "03. 강화도 정족산 14처길 낮", lat: 37.636524, lng: 126.487527, 
            desc: "여름의 강화도는 생명력이 넘쳐흐른다.\n7년이라는 긴 시간을 땅속에서 견디고 마침내 세상 밖으로 터져 나온 매미들의 압도적인 에너지가 공기를 가득 채운다.\n그 기세에 질세라, 시샘 어린 동네 개들이 짖어대며 사이키델릭한 강화도의 여름풍경이 그려진다.",
            meta: "Date: 2025-08-06 14:00 ☀️\nRecording: Zoom F3 / Clippy EM272 pair / AB Stereo"
        },
        { id: "843445286", title: "04. 강화도 정족산 입구 밤", lat: 37.631870, lng: 126.477204, desc: "정족산성 입구 밤의 소리풍경.", meta: "Recording: Zoom F3 / Clippy EM272" },
        { id: "372803100", title: "05. 전등사 저녁예불 대고", lat: 37.631830, lng: 126.484682, desc: "전등사 법고 소리.", meta: "Recording: Zoom F3 / Clippy EM272" },
        { id: "1394143868", title: "06. 전등사 저녁예불 범종", lat: 37.631493, lng: 126.483674, desc: "전등사 범종 소리.", meta: "Recording: Zoom F3 / Clippy EM272" },
        { id: "925560464", title: "07. 동검도 동그랑섬", lat: 37.589020, lng: 126.525597, desc: "동검도 갯벌 소리.", meta: "Recording: Zoom F3 / Clippy EM272" },
        { id: "1588339098", title: "08. 강화도 대산저수지", lat: 37.785945, lng: 126.479647, desc: "대산저수지 바람 소리.", meta: "Recording: Zoom F3 / Clippy EM272" },
        { 
            id: "224371653", title: "09. 광성보 우수관 빗방울 소리", lat: 37.665276, lng: 126.530615, 
            desc: "광성보를 산책하다 갯벌 하구로 연결된 우수관을 발견했고\n녹음기를 넣어 공간의 울림을 들어봤다.\n똑,똑,똑 떨어지는 물소리 그리고 이따금 한번씩 들려오는 저역대의 숨소리",
            meta: "Date: 2025-11-19 🌧️\nRecording: Zoom F3 / Clippy EM272 pair / AB Stereo"
        },
        { 
            id: "4164866312", title: "10. 교동도 남산포구 밀물때", lat: 37.763106, lng: 126.290747, 
            desc: "갯벌에 물이 차오르는 소리는 부드러운 자장가 같다.\n미루지항에서 엄마와 함께 물이 들어오는 소리를 녹음했다.",
            meta: "Date: 2026-01-17 🌤️\nRecording: Zoom F3 / Earsight The One microphone / ORTF stereo"
        },
        { id: "519450696", title: "11. 강화도 북일곶돈대 해안가", lat: 37.611408, lng: 126.375040, desc: "해안가 파도 소리.", meta: "Recording: Zoom F3" },
        { id: "64694152", title: "12. 교동도 월선포구 썰물때", lat: 37.774263, lng: 126.316992, desc: "월선포구 갯벌 소리.", meta: "Recording: Zoom F3" },
        { id: "2110564066", title: "13. 강화도 첫눈", lat: 37.638092, lng: 126.490264, desc: "강화도에 내리는 첫눈의 정적.", meta: "Recording: Zoom F3" },
        { 
            id: "2505151801", title: "14. 온수리 성당 삼종소리", lat: 37.640278, lng: 126.489879, 
            desc: "온수리 성공회 성당 종소리 땡그랑~땡그랑~\n고상만 복사님은 매일 기도하는 신자를 위해 삼종을 쳐주신다.\n하루 세 번 종을 울리신다.",
            meta: "Date: 2025-11-22-12:00 🌤️\nRecording: Zoom F3 / Earsight The One microphone / ORTF stereo"
        },
        { 
            id: "3520696282", title: "15. 평화전망대 앞 바람이 실어온 북쪽 소리", lat: 37.820137, lng: 126.444672, 
            desc: "민간인 통제 지역인 강화도 평화전망대 인근 강가에서 기록했다.\n철조망과 강을 사이에 두고 북한에서 민통선을 넘어온 음악이 바람에 덮여 아주 희미하게 들린다.",
            meta: "Date: 2026-1-14 ☁️\nRecording: Zoom F3 / Earsight The One microphone / ORTF stereo"
        },
        { 
            id: "3411754260", title: "16. 교동도 민가 새벽의 바람", lat: 37.768691, lng: 126.290418, 
            desc: "수탁과 개가 섬을 깨우고\n섬 바람에 나무들이 일어나며 기지게를 편다.",
            meta: "Date: 2025-11-22 ☁️\nRecording: Zoom F3 / Audio-Technica AT8022 / XY stereo\nformat: 48kHz / 32bit float"
        }
    ];

    const map = L.map('map', { zoomControl: false }).setView([37.68, 126.43], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

    const markers = [];
    soundData.forEach((data, idx) => {
        const marker = L.marker([data.lat, data.lng]).addTo(map);
        marker.on('click', () => {
            document.querySelectorAll('.track-item').forEach((el, i) => el.classList.toggle('active', i === idx));
            const content = `
                <div class="track-info-popup">
                    <b>${data.title}</b>
                    <div class="track-desc">${data.desc}</div>
                    <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/track=${data.id}/transparent=true/autoplay=1/" seamless></iframe>
                    <div class="track-meta">${data.meta.replace(/\n/g, '<br>')}</div>
                </div>`;
            marker.bindPopup(content).openPopup();
        });
        markers.push(marker);

        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerText = data.title;
        item.onclick = () => { map.flyTo([data.lat, data.lng], 14); marker.fire('click'); };
        document.getElementById('track-list').appendChild(item);
    });

    function showTab(type, btn) {
        document.getElementById('tab-content').innerText = infoData[type];
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    showTab('about', document.querySelector('.tab-btn'));
</script>
</body>
</html>
