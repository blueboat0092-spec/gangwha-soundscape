<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GANGHWA ISLAND SOUNDSCAPE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap');

        :root {
            --accent-red: #8e1d32;
            --beige-bg: #f5f1e6;
            --dark-panel: #1a1a1a;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; background: #e8caca; overflow: hidden; }
        #app { display: flex; width: 100vw; height: 100vh; position: relative; }

        #map { width: 100%; height: 100%; z-index: 1; filter: sepia(0.1) contrast(0.95); }
        
        /* 왼쪽 인터페이스 */
        .left-interface {
            position: absolute; left: 0; top: 0; bottom: 0; width: 60px;
            background: var(--beige-bg); border-right: 1px solid rgba(0,0,0,0.1);
            z-index: 3000; display: flex; flex-direction: column; align-items: center; padding-top: 20px;
        }
        .menu-btn { width: 44px; height: 44px; background: var(--accent-red); color: white; border: none; cursor: pointer; font-size: 22px; margin-bottom: 10px; }
        .zoom-wrap { display: flex; flex-direction: column; gap: 4px; z-index: 3001; margin-bottom: 20px; }
        .z-btn { width: 36px; height: 36px; background: white; border: 1px solid #ddd; cursor: pointer; font-weight: bold; }
        .branding { position: absolute; bottom: 40px; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--accent-red); font-weight: 900; font-size: 17px; letter-spacing: 1.5px; white-space: nowrap; z-index: 3000; }

        /* 오른쪽 사이드바 */
        #sidebar-right { width: 320px; background: rgba(255, 255, 255, 0.98); z-index: 2000; display: flex; flex-direction: column; border-left: 1px solid #eee; }
        .list-header { padding: 35px 25px 15px; font-weight: 800; color: #bbb; font-size: 11px; letter-spacing: 2px; }
        #track-list { flex: 1; overflow-y: auto; }
        .track-item { padding: 16px 25px; border-bottom: 1px solid #f2f2f2; cursor: pointer; transition: 0.2s; font-size: 13px; color: #666; line-height: 1.4; }
        .track-item:hover { background: var(--beige-bg); }
        .track-item.active { border-left: 6px solid var(--accent-red); color: var(--accent-red); font-weight: 700; background: #fff; }

        /* 하단 마스터 컨트롤러 & 플레이바 */
        #master-controller { height: 160px; background: var(--dark-panel); display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .now-playing { color: #888; font-size: 11px; margin-bottom: 8px; font-weight: 600; letter-spacing: 1px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ctrl-row { display: flex; align-items: center; gap: 35px; margin-bottom: 15px; }
        .btn-ui { background: none; border: none; color: white; cursor: pointer; font-size: 24px; transition: 0.2s; padding: 5px; }
        .btn-ui:hover { color: var(--accent-red); }
        
        /* 플레이바 스타일 */
        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; }
        .time-text { color: #555; font-size: 10px; font-family: monospace; width: 35px; }
        .progress-bar { flex: 1; height: 4px; background: #333; border-radius: 2px; position: relative; cursor: pointer; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent-red); transition: width 0.1s linear; }

        /* 지도 마커 & 팝업 */
        .ear-icon { background: var(--accent-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.4); border: 2px solid white; cursor: pointer; }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 0; padding: 12px; background: var(--beige-bg); }
        .diary-box { line-height: 1.7; font-size: 13px; color: #222; }
        .diary-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 16px; color: var(--accent-red); margin-bottom: 12px; display: block; }
        .diary-text { margin-bottom: 12px; white-space: pre-line; }
        .diary-meta { font-size: 11px; color: #777; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px; font-family: monospace; }
        .popup-embed { margin-top: 12px; border: 0; width: 100%; height: 42px; }
    </style>
</head>
<body>

<div id="app">
    <div class="left-interface">
        <button class="menu-btn" onclick="toggleInfo()">☰</button>
        <div class="zoom-wrap">
            <button class="z-btn" onclick="map.zoomIn()">+</button>
            <button class="z-btn" onclick="map.zoomOut()">-</button>
        </div>
        <div class="branding">GANGHWA ISLAND SOUNDSCAPE</div>
    </div>

    <div id="map"></div>

    <div id="sidebar-right">
        <div class="list-header">강화 사운드스케이프앨범</div>
        <div id="track-list"></div>
        
        <div id="master-controller">
            <div id="current-title" class="now-playing">SELECT A SOUNDSCAPE</div>
            <div class="ctrl-row">
                <button class="btn-ui" onclick="changeTrack(-1)">⏮</button>
                <button id="play-pause" class="btn-ui" style="font-size:32px;" onclick="togglePlay()">▶</button>
                <button class="btn-ui" onclick="changeTrack(1)">⏭</button>
            </div>
            <!-- 플레이바 -->
            <div class="progress-container">
                <span class="time-text">0:00</span>
                <div class="progress-bar" onclick="seek(event)">
                    <div id="p-fill" class="progress-fill"></div>
                </div>
                <span class="time-text">--:--</span>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let activeIdx = -1;
    let isPlaying = false;
    let progressInterval;

    const soundData = [
        { id: "2989378636", title: "01. 강화도 국자와주걱 책방 앞", lat: 37.652175, lng: 126.440529, diary: "강화도 도장리 마을의 오후 소리풍경.\n책방 앞에 걸린 풍경이 바람에 울리고, 목수는 집을 고친다.", meta: "Date: 2025-11-20 ☁️" },
        { id: "753759855", title: "02. 사운드워킹-석모도 민머루해변", lat: 37.6512988, lng: 126.3331996, diary: "모래사장 위를 걸으며 내 속도를 느낄 때.", meta: "Date: 2026-02-04 17:10 🌤️" },
        { id: "1719650266", title: "03. 강화도 정족산 14처길 낮", lat: 37.6365248, lng: 126.4875273, diary: "여름의 기운이 가득한 숲의 소리.", meta: "Date: 2025-08-06 14:00 ☀️" },
        { id: "843445286", title: "04. 강화도 정족산 입구 밤", lat: 37.631870, lng: 126.477204, diary: "정족산의 깊은 밤, 고요 속의 미세한 숨소리.", meta: "Recording: Zoom F3" },
        { id: "224371653", title: "09. 광성보 우수관 빗방울 소리", lat: 37.665276, lng: 126.530615, diary: "똑,똑,똑 떨어지는 물소리와 공간의 울림.", meta: "Date: 2025-11-19 🌧️" },
        { id: "4164866312", title: "10. 교동도 남산포구 밀물때", lat: 37.763106, lng: 126.290747, diary: "갯벌에 물이 차오르는 부드러운 소리.", meta: "Date: 2026-01-17 🌤️" },
        { id: "3520696282", title: "15. 평화전망대 앞 바람 소리", lat: 37.820137, lng: 126.444672, diary: "민통선 너머 희미하게 들려오는 북쪽의 소리.", meta: "Date: 2026-1-14 ☁️" },
        { id: "3411754260", title: "16. 교동도 민가 새벽의 바람", lat: 37.768691, lng: 126.290418, diary: "수탉과 개가 섬을 깨우고 나무들이 기지개를 켜는 소리.", meta: "Date: 2025-11-22 ☁️" }
    ];

    const map = L.map('map', { zoomControl: false }).setView([37.68, 126.43], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

    const markers = [];

    // 리스트 클릭 시 실행되는 메인 함수
    function playTrack(idx) {
        if(idx === activeIdx) return;
        activeIdx = idx;
        const track = soundData[idx];

        // 1. 하단 UI 업데이트
        document.getElementById('current-title').innerText = track.title.toUpperCase();
        document.getElementById('play-pause').innerText = '⏸';
        isPlaying = true;

        // 2. 우측 리스트 상태 변경
        document.querySelectorAll('.track-item').forEach((el, i) => el.classList.toggle('active', i === idx));

        // 3. 지도 이동 및 팝업 자동 열기 (자동 재생 임베드 포함)
        map.flyTo([track.lat, track.lng], 14);
        markers[idx].openPopup();

        // 4. 플레이바 애니메이션 시뮬레이션
        startProgressBar();
    }

    function togglePlay() {
        if(activeIdx === -1) { playTrack(0); return; }
        isPlaying = !isPlaying;
        document.getElementById('play-pause').innerText = isPlaying ? '⏸' : '▶';
    }

    function changeTrack(step) {
        let next = (activeIdx + step + soundData.length) % soundData.length;
        playTrack(next);
    }

    // 플레이바 시뮬레이션 (실제 오디오 API 연동 전 시각적 피드백용)
    function startProgressBar() {
        clearInterval(progressInterval);
        let progress = 0;
        const fill = document.getElementById('p-fill');
        progressInterval = setInterval(() => {
            if(isPlaying && progress < 100) {
                progress += 0.2;
                fill.style.width = progress + '%';
            }
        }, 500);
    }

    soundData.forEach((data, idx) => {
        const earSvg = `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M12 2C8.69 2 6 4.69 6 8v3.29c-1.13.43-2 1.54-2 2.86 0 1.66 1.34 3 3 3h.5c.83 0 1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5H7c0-2.76 2.24-5 5-5s5 2.24 5 5h-.5c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5h.5c1.66 0 3-1.34 3-3 0-1.32-.87-2.43-2-2.86V8c0-3.31-2.69-6-6-6z"/></svg>`;
        const icon = L.divIcon({ className: 'ear-icon', html: earSvg, iconSize: [32,32], iconAnchor: [16,16] });
        const marker = L.marker([data.lat, data.lng], { icon }).addTo(map);
        markers.push(marker);

        const popupBody = `
            <div class="diary-box">
                <span class="diary-title">${data.title}</span>
                <div class="diary-text">${data.diary}</div>
                <div class="diary-meta">${data.meta.replace(/\n/g, '<br>')}</div>
                <iframe class="popup-embed" src="https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=f5f1e6/linkcol=8e1d32/track=${data.id}/transparent=true/autoplay=true/"></iframe>
            </div>`;
        
        marker.bindPopup(popupBody, { className: 'custom-popup', maxWidth: 280 });
        
        // 마커 클릭 시 리스트와 동기화
        marker.on('click', () => {
            activeIdx = idx;
            document.getElementById('current-title').innerText = data.title.toUpperCase();
            document.querySelectorAll('.track-item').forEach((el, i) => el.classList.toggle('active', i === idx));
        });

        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `<b>${String(idx+1).padStart(2,'0')}</b> &nbsp; ${data.title}`;
        item.onclick = () => playTrack(idx);
        document.getElementById('track-list').appendChild(item);
    });
</script>
</body>
</html>
