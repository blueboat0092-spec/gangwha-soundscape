<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강화도 사운드스케이프</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; background: #111; color: #eee; }
        #container { display: flex; height: 100vh; }
        #sidebar { width: 350px; background: #1a1a1a; padding: 25px; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #map { flex: 1; }
        h1 { font-size: 20px; margin-bottom: 10px; color: #fff; }
        .intro { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .track-item { padding: 15px; margin-bottom: 10px; background: #222; border-radius: 8px; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .track-item:hover { background: #333; border-color: #555; }
        .track-title { font-weight: 600; font-size: 15px; margin-bottom: 5px; }
        .track-loc { font-size: 12px; color: #666; }
        /* 팝업 스타일 */
        .leaflet-popup-content-wrapper { background: #222; color: #fff; border-radius: 8px; }
        .leaflet-popup-tip { background: #222; }
        iframe { border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <h1>강화도 사운드스케이프</h1>
        <div class="intro">
            접속 시 나타나는 소개글입니다. <br> 왼쪽 리스트를 클릭하면 지도가 이동하며 소리를 감상하실 수 있습니다.
        </div>
        <div id="track-list"></div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 지도 설정
    const map = L.map('map', { zoomControl: false }).setView([37.652175, 126.440529], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // 어두운 테마 지도 타일
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 아티스트님의 데이터 (샘플)
    const soundData = [
        {
            title: "교동도 대룡시장 제비소리",
            lat: 37.7812, lng: 126.3154,
            desc: "시장의 활기찬 소리와 제비들의 지저귐",
            audio: "https://bandcamp.com/EmbeddedPlayer/album=3082352877/size=small/bgcol=333333/linkcol=0687f5/transparent=true/"
        },
        {
            title: "장봉도 가막머리",
            lat: 37.5218, lng: 126.1732,
            desc: "파도와 자갈이 만드는 리듬",
            audio: "https://bandcamp.com/EmbeddedPlayer/album=3082352877/size=small/bgcol=333333/linkcol=0687f5/transparent=true/"
        }
    ];

    const listDiv = document.getElementById('track-list');

    soundData.forEach(data => {
        // 마커 추가
        const marker = L.marker([data.lat, data.lng]).addTo(map);
        const popupContent = `
            <div style="width:200px">
                <b style="font-size:14px">${data.title}</b><br>
                <p style="font-size:12px; color:#ccc">${data.desc}</p>
                <iframe style="border: 0; width: 100%; height: 42px;" src="${data.audio}" seamless></iframe>
            </div>
        `;
        marker.bindPopup(popupContent);

        // 리스트 아이템 추가
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `<div class="track-title">${data.title}</div><div class="track-loc">강화도 기록물</div>`;
        
        item.onclick = () => {
            map.flyTo([data.lat, data.lng], 14);
            setTimeout(() => marker.openPopup(), 1000);
        };
        listDiv.appendChild(item);
    });
</script>

</body>
</html>
