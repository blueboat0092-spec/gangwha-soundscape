<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강화도 사운드스케이프 아카이브</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; background: #111; color: #eee; }
        #container { display: flex; height: 100vh; }
        #sidebar { width: 380px; background: #1a1a1a; padding: 25px; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #map { flex: 1; }
        h1 { font-size: 22px; margin-bottom: 10px; color: #fff; letter-spacing: -0.5px; }
        .intro { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .track-item { padding: 15px; margin-bottom: 10px; background: #222; border-radius: 8px; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .track-item:hover { background: #2b2b2b; border-color: #0687f5; }
        .track-title { font-weight: 600; font-size: 14px; margin-bottom: 5px; color: #fff; }
        .track-meta { font-size: 11px; color: #666; }
        .leaflet-popup-content-wrapper { background: #222; color: #fff; border-radius: 12px; border: 1px solid #444; padding: 5px; }
        .leaflet-popup-tip { background: #222; }
    </style>
</head>
<body>
<div id="container">
    <div id="sidebar">
        <h1>강화도 사운드스케이프</h1>
        <div class="intro">강화도 도장리에서 평화전망대까지, 섬의 곳곳에서 채집한 소리 기록입니다. 마커나 리스트를 클릭하여 그날의 공기를 느껴보세요.</div>
        <div id="track-list"></div>
    </div>
    <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 강화도 중심부로 지도 시작 위치 설정
    const map = L.map('map', { zoomControl: false }).setView([37.68, 126.43], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);

    const soundData = [
        { title: "01. 강화도 국자와주걱 책방 앞", lat: 37.652175, lng: 126.440529, desc: "책방 앞 풍경 소리와 고양이의 인사 (2025-11-20)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=2989378636/transparent=true/" },
        { title: "02. 사운드워킹-석모도 민머루해변", lat: 37.6512988, lng: 126.3331996, desc: "모래사장 위를 걷는 발자국 소리 (2026-02-04)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=753759855/transparent=true/" },
        { title: "03. 강화도 정족산 14처길 낮", lat: 37.6365248, lng: 126.4875273, desc: "압도적인 매미 소리와 동네 개 짖는 소리 (2025-08-06)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=1719650266/transparent=true/" },
        { title: "04. 강화도 정족산 입구 밤", lat: 37.631870, lng: 126.477204, desc: "정족산의 고요한 밤 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=843445286/transparent=true/" },
        { title: "05. 전등사 저녁예불 대고", lat: 37.631830, lng: 126.484682, desc: "웅장한 북소리의 울림", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=372803100/transparent=true/" },
        { title: "06. 전등사 저녁예불 범종", lat: 37.631493, lng: 126.483674, desc: "깊은 여운의 범종 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=1394143868/transparent=true/" },
        { title: "07. 동검도 동그랑섬", lat: 37.589020, lng: 126.525597, desc: "동검도 해변의 환경음", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=925560464/transparent=true/" },
        { title: "08. 강화도 대산저수지", lat: 37.785945, lng: 126.479647, desc: "저수지의 잔잔한 대기음", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=1588339098/transparent=true/" },
        { title: "09. 광성보 우수관 빗방울 소리", lat: 37.665276, lng: 126.530615, desc: "우수관 내부의 공명과 빗방울 (2025-11-19)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=224371653/transparent=true/" },
        { title: "10. 교동도 남산포구 밀물", lat: 37.763106, lng: 126.290747, desc: "자장가 같은 밀물 소리 (2026-01-17)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=4164866312/transparent=true/" },
        { title: "11. 강화도 북일곶돈대 해안가", lat: 37.611408, lng: 126.375040, desc: "돈대 해안의 파도 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=519450696/transparent=true/" },
        { title: "12. 교동도 월선포구 썰물", lat: 37.774263, lng: 126.316992, desc: "갯벌이 드러나는 시간의 소리", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=64694152/transparent=true/" },
        { title: "13. 강화도 첫눈", lat: 37.638092, lng: 126.490264, desc: "강화도에 내리는 첫눈의 질감", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=2110564066/transparent=true/" },
        { title: "14. 온수리 성당 삼종소리", lat: 37.640278, lng: 126.489879, desc: "성공회 성당 복사님이 울리는 삼종 (2025-11-22)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=2505151801/transparent=true/" },
        { title: "15. 평화전망대 바람의 북쪽 소리", lat: 37.820137, lng: 126.444672, desc: "바람을 타고 넘어오는 희미한 음악 (2026-01-14)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=3520696282/transparent=true/" },
        { title: "16. 교동도 민가 새벽의 바람", lat: 37.768691, lng: 126.290418, desc: "수탁과 개가 깨우는 섬의 새벽 (2025-11-22)", audio: "https://bandcamp.com/EmbeddedPlayer/album=1457254492/size=small/bgcol=333333/linkcol=0687f5/track=3411754260/transparent=true/" }
    ];

    const listDiv = document.getElementById('track-list');
    soundData.forEach(data => {
        const marker = L.marker([data.lat, data.lng]).addTo(map);
        const popupContent = `
            <div style="width:250px; padding:5px;">
                <b style="font-size:15px; color:#fff;">${data.title}</b><br>
                <p style="font-size:12px; color:#aaa; margin: 10px 0; line-height:1.4;">${data.desc}</p>
                <iframe style="border: 0; width: 100%; height: 42px; border-radius:4px;" src="${data.audio}" seamless></iframe>
            </div>
        `;
        marker.bindPopup(popupContent);

        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `<div class="track-title">${data.title}</div><div class="track-meta">Yi Cheolmin Sound Archive</div>`;
        item.onclick = () => {
            map.flyTo([data.lat, data.lng], 14, { duration: 1.5 });
            setTimeout(() => marker.openPopup(), 1600);
        };
        listDiv.appendChild(item);
    });
</script>
</body>
</html>
